#
# max_revisions: 3
# reviewer_threshold: 9
# max_goal_iterations: 8

# ═══════════════════════════════════════════════════════════════
# PRESET C — Event-driven (Абдуллин, для >100 сценариев)
# ═══════════════════════════════════════════════════════════════
#
# stack: python
# driver: event-driven
# feature_dirs: ["scenarios/"]
# step_dirs: []
# helper_dirs: ["scenarios/helpers/"]
# source_globs: ["src/**/*.py"]
#
# event_driven:
#   event_store: "src/events/store.py"
#   runner: "python -m scenarios.runner {feature_path}"
#   scenario_module_pattern: "*_scenario.py"
#   serializer: "json"
#
# harness:
#   command: "python -m scenarios.runner {feature_path}"
#   command_scenario: "python -m scenarios.runner {feature_path}::{scenario_name}"
#
# philosophy: |
#   - Сценарий = @scenario-декорированная функция с given/when/then
#   - Given = список событий (dataclass), When = одна команда, Then = ожидаемые события
#   - Строгое равенство then_events == resulting_events (порядок важен если явно указан)
#   - Продакту показываем сгенерированный .md, .py — источник истины
