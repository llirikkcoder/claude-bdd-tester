# .bdd-config.yaml — starter template
# Полная схема: ~/.claude/skills/bdd-tester/references/bdd-config.md
# Раскомментируй нужный preset и удали остальные.

# ═══════════════════════════════════════════════════════════════
# PRESET A — Python + behave
# ═══════════════════════════════════════════════════════════════

stack: python
driver: behave
feature_dirs: ["features/"]
step_dirs: ["features/steps/"]
helper_dirs: ["features/helpers/"]
source_globs: ["src/**/*.py"]
ignore_globs: ["**/migrations/**", "**/vendor/**"]

harness:
  command: "behave {feature_path} --no-capture --format=progress3"
  command_scenario: "behave {feature_path} -n \"{scenario_name}\""
  timeout_sec: 300

philosophy: |
  - Declarative Given-When-Then. Никаких кликов/URL/полей формы в тексте сценария.
  - Одна поведенческая единица на сценарий.
  - Конкретные значения, не абстрактные.
  - Background — только если общее для >=3 сценариев в feature.
  - Implementer никогда не редактирует .feature или step defs, чтобы сделать зелёным.
  - Моки — в environment.py hooks, никогда inline в step definitions.

max_revisions: 3
reviewer_threshold: 9
max_goal_iterations: 8
same_scenario_retry_limit: 3

drift_thresholds:
  significant_change_lines: 30
  coverage_gap_severity: warning

# ═══════════════════════════════════════════════════════════════
# PRESET B — TS + Playwright-BDD (e2e веб-воронки)
# ═══════════════════════════════════════════════════════════════
